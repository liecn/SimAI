# YAML config for dataset, training, and model parameters

# Dataset parameters
dataset:
  shard: 0
  lr: 10
  n_links_max: 768
  train_frac: 0.9
  topo_type: "_topology_flows"
  sampling_method: "balanced" # weighted, uniform, balanced
  flow_size_threshold: 100000000
  enable_flowsim_gt: False
  enable_remainsize: False
  enable_queuelen: False

network:
  buffer_size: 20.0    # Buffer size (bfsz parameter)
  fwin: 10.0            # Flow window parameter  
  dctcp_k: 10.0         # DCTCP threshold parameter

# M4-specific parameters
m4:
  batch_time_ns: 20000           # Temporal batching interval (ns) - smaller = smoother slowdowns
  reschedule_flow_count: 32     # Reschedule all active flows every N new arrivals (0 = every batch, slower but more accurate)
  
  # Bottleneck correction (compensate for heterogeneous topology)
  enable_bottleneck_correction: true
  bottleneck_correction_factor: 2.8      # Scale slowdown for flows traversing bottleneck links
  bottleneck_threshold_bps: 400000000000 # 400 Gbps - paths with lower bandwidth are considered bottlenecks

# Model parameters
model:
  input_size: 2
  n_layer: 2
  gcn_n_layer: 3
  loss_fn_type: "l1"
  hidden_size: 200
  gcn_hidden_size: 300
  dropout: 0.0
  enable_positional_encoding: False
  enable_gnn: True
  enable_lstm: True
  enable_link_state: True

# Training parameters
training:
  gpu: [0]
  n_epochs: 5
  batch_size: 1
  learning_rate: 0.0001
  num_workers: 2
  enable_val: False
  enable_dist: False